name: Daily Telegram Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: daily-telegram-digest
  cancel-in-progress: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TREND_REPORT_PATH: outputs/trend-report.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate trend report
        run: npm run trends:web

      - name: Send Telegram digest
        run: npm run daily-telegram
