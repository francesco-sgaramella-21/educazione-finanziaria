name: Daily Telegram Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: daily-telegram-digest
  cancel-in-progress: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TREND_REPORT_PATH: outputs/trend-report.json
      TREND_HISTORY_PATH: .trend-memory/sent-topics.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore trend memory
        uses: actions/cache@v4
        with:
          path: .trend-memory
          key: trend-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            trend-memory-${{ github.ref_name }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate trend report
        run: npm run trends:web

      - name: Send Telegram digest
        run: npm run daily-telegram
